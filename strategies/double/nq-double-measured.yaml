id: nq-double-measured
name: Nasdaq Double Top/Bottom
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Double top / bottom
summary: Targets the pattern's measured move. Trades bigger when volume is strong.
how_it_enters: Looks for price testing the same level twice and failing (a W shape at the bottom or an M shape at
  the top). When price breaks the middle of the pattern, it enters in the new direction. The stop goes just beyond
  the two tests.
how_it_exits: Takes part of the profit at the first target and lets the rest run with a trailing stop. After the
  first target the stop moves to break-even, so the rest cannot lose. On signals with strong volume it trades double
  the size.
experimental: false
