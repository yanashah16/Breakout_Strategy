  t_atr_len: 5
  rev_vol_min: null
  rev_vol_max: null
  adx_len: 14
  adx_min: 25
  risk_usd: null
  qty_t1: 1
  t1_atr: 1.0
  qty_t2: 2
  trail_atr: 10.0
  t2_atr: 20
  max_hold_days: 14
  trail_act: 2.0
