# Nasdaq Flat Zone 10m Select  -  from nq_wae_backtest/flatzone/flatzone_NQ_10m_lo.yaml (backtest: research/flatzone_backtest.py)
# Research notes:
# Flat Zone Breakout - NQ 10 min, FEWER than 1000 trades (legs). Optimised 2026-11-22 (random + evolutionary + hill-climb search, ~27k combos for this timeframe, 1 tick slip).
#   1 tick: net $1,049k, max DD $44k, net/DD 23.99, 308 trades (616 legs), PF 2.57.
#   0 slip net/DD 24.24 | 2 ticks 23.74 | 2016-22 net/DD 7.0, 2023-26 26.9 | neighbours median 16.0
#   Run:  python flatzone/flatzone_backtest.py flatzone/flatzone_NQ_10m_lo.yaml
id: nq-flatzone-10m-select
name: Nasdaq Flat Zone 10m Select
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 10-minute candles, long only.
how_it_enters: 'Finds a flat zone: 5+ candles (10-minute) whose closes stay within 1.2 ATR and drift at most 15 % of the zone
  height. A candle closing 0 % of the height beyond the zone (with a body that size) enters at that close, long only. Only
  if the candle''s volume is >= 2.2 x the same time of day''s average (40 days). No entries 14:00-16:00 New York. Volume >=
  4.0 x average: x2 quantity.'
how_it_exits: Stop at 4.0 ATR from the breakout close. Target contracts take profit 0.75 ATR from the breakout close. Runner
  contracts trail 8.0 ATR behind the best price, from 2.0 ATR in profit. Runner cap 12 ATR. If the first stop is hit within
  30 candles it reverses once (same size, same stop distance). Closed after 20 days.
experimental: false
default_qty:
- 1
- 2
engine: flatzone
source: nq_wae_backtest/flatzone/flatzone_NQ_10m_lo.yaml
data: {}
logic:
  timeframe: 10
  min_bars: 5
  max_bars: 60
