#   Run:  python flatzone/flatzone_backtest.py flatzone/flatzone_YM_15m_both.yaml
id: dow-flatzone-15m
name: Dow Flat Zone 15m
family: Dow
signal: YM
markets:
- MYM
- YM
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 15-minute candles, long and short.
how_it_enters: 'Finds a flat zone: 6+ candles (15-minute) whose closes stay within 2.2 ATR and drift at most 35 % of the zone
  height. A candle closing 50 % of the height beyond the zone (with a body that size) enters at that close, long or short.
  Only if the candle''s volume is >= 0.8 x the same time of day''s average (20 days). Only when ADX(14) >= 25. Volume >= 6.0
  x average: x2 quantity.'
how_it_exits: Stop at 3.0 ATR from the breakout close. Target contracts take profit 2.5 ATR from the breakout close. Runner
  contracts trail 12.0 ATR behind the best price. Runner cap 20 ATR. At 3.0 ATR profit every stop locks entry + 1.0 ATR. Closed
  after 7 days.
experimental: false
default_qty:
- 1
- 2
engine: flatzone
source: nq_wae_backtest/flatzone/flatzone_YM_15m_both.yaml
