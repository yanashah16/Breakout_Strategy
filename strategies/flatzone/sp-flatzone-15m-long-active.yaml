id: sp-flatzone-15m-long-active
name: S&P Flat Zone 15m Long Active
family: S&P 500
signal: ES
markets:
- MES
- ES
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 15-minute candles, long only.
how_it_enters: 'Finds a flat zone: 10+ candles (15-minute) whose closes stay within 3.0 ATR and drift at most 40 % of the
  zone height. A candle closing 20 % of the height beyond the zone (by close) enters at that close, long only. Only if the
  candle''s volume is >= 1.3 x the same time of day''s average (20 days). No entries 22:00-02:00 New York. Volume >= 2.5 x
  average: x2 quantity.'
how_it_exits: Stop at 5.0 ATR from the breakout close. Target contracts take profit 0.75 ATR from the breakout close. Runner
  contracts trail 8.0 ATR behind the best price, from 2.0 ATR in profit. Runner cap 6 ATR. At 2.5 ATR profit every stop locks
  entry + 1.0 ATR. If the first stop is hit within 3 candles it reverses once (same size, same stop distance). Closed after
  0.5 days.
experimental: false
