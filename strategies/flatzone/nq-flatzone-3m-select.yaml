# Nasdaq Flat Zone 3m Select  -  from nq_wae_backtest/flatzone/flatzone_NQ_3m_lo.yaml (backtest: research/flatzone_backtest.py)
# Research notes:
# Flat Zone Breakout - NQ 3 min, FEWER than 1000 trades (legs). Optimised 2026-11-22 (random + evolutionary + hill-climb search, ~27k combos for this timeframe, 1 tick slip).
#   1 tick: net $406k, max DD $18k, net/DD 22.51, 492 trades (984 legs), PF 2.58.
#   0 slip net/DD 23.68 | 2 ticks 20.65 | 2016-22 net/DD 15.0, 2023-26 16.7 | neighbours median 17.7
#   Run:  python flatzone/flatzone_backtest.py flatzone/flatzone_NQ_3m_lo.yaml
id: nq-flatzone-3m-select
name: Nasdaq Flat Zone 3m Select
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 3-minute candles, long only.
how_it_enters: 'Finds a flat zone: 12+ candles (3-minute) whose closes stay within 1.9 ATR and drift at most 50 % of the zone
  height. A candle closing 100 % of the height beyond the zone (by close) enters at that close, long only. Only if the candle''s
  volume is >= 1.2 x the same time of day''s average (10 days). Only when ADX(14) >= 20. No entries 02:00-08:00 New York.'
how_it_exits: Stop at 2.5 ATR from the breakout close. Target contracts take profit 1.5 ATR from the breakout close; the stop
  of the rest then moves to the entry (from the next candle). Runner contracts trail 4.0 ATR behind the best price. Runner
  cap 20 ATR. At 2.0 ATR profit every stop locks entry + 0.5 ATR. If the first stop is hit within 5 candles it reverses once
  (same size, same stop distance). Closed after 2 days.
experimental: false
default_qty:
- 1
- 2
engine: flatzone
source: nq_wae_backtest/flatzone/flatzone_NQ_3m_lo.yaml
data: {}
logic:
  timeframe: 3
  min_bars: 12
  max_bars: 30
  box_src: close
  atr_len: 30
  max_h_atr: 1.9
  max_slope: 50
  break_mode: close
  break_pct: 100
  direction: Long only
  skip_hours: 02:00-08:00
  rev_bars: 5
  vol_ref: tod
  vol_days: 10
  vol_min: 1.2
  vol_boost: null
  vol_mult: 2
  qty_step: null
  qty_tiers: 2000:4, 4000:3, 6000:2, 8000:1
  t_atr_len: 5
  rev_vol_min: null
  rev_vol_max: null
  adx_len: 14
  adx_min: 20
  risk_usd: null
  qty_t1: 1
  t1_atr: 1.5
  qty_t2: 2
  trail_atr: 4.0
  t2_atr: 20
  max_hold_days: 2
  trail_act: 0.0
