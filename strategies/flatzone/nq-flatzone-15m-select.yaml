# Nasdaq Flat Zone 15m Select  -  from nq_wae_backtest/flatzone/flatzone_NQ_15m_lo.yaml (backtest: research/flatzone_backtest.py)
# Research notes:
# Flat Zone Breakout - NQ 15 min, FEWER than 1000 trades (legs). Optimised 2026-11-22 (random + evolutionary + hill-climb search, ~27k combos for this timeframe, 1 tick slip).
#   1 tick: net $493k, max DD $21k, net/DD 23.66, 330 trades (660 legs), PF 2.30.
#   0 slip net/DD 24.57 | 2 ticks 22.09 | 2016-22 net/DD 17.9, 2023-26 17.6 | neighbours median 16.8
#   Run:  python flatzone/flatzone_backtest.py flatzone/flatzone_NQ_15m_lo.yaml
id: nq-flatzone-15m-select
name: Nasdaq Flat Zone 15m Select
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 15-minute candles, long only.
how_it_enters: 'Finds a flat zone: 9+ candles (15-minute) whose closes stay within 1.2 ATR and drift at most 15 % of the zone
  height. A candle closing 60 % of the height beyond the zone (by close) enters at that close, long only. Only if the candle''s
  volume is >= 1.5 x the same time of day''s average (10 days). No entries 14:00-16:00 New York. Volume >= 1.8 x average:
  x2 quantity.'
how_it_exits: Stop at 2.0 ATR from the breakout close. Target contracts take profit 3.0 ATR from the breakout close; the stop
  of the rest then moves to the entry (from the next candle). Runner contracts trail 1.5 ATR behind the best price, from 1.0
  ATR in profit. Runner cap 6 ATR. At 3.0 ATR profit every stop locks entry + 0.0 ATR. If the first stop is hit within 40
  candles it reverses once (same size, same stop distance). Closed after 2 days.
experimental: false
default_qty:
- 1
- 2
engine: flatzone
source: nq_wae_backtest/flatzone/flatzone_NQ_15m_lo.yaml
data: {}
logic:
  timeframe: 15
  min_bars: 9
  max_bars: 40
  box_src: close
  atr_len: 200
  max_h_atr: 1.2
  max_slope: 15
  break_mode: close
  break_pct: 60
  direction: Long only
  skip_hours: 14:00-16:00
  rev_bars: 40
  vol_ref: tod
  vol_days: 10
  vol_min: 1.5
  vol_boost: 1.8
  vol_mult: 2
  qty_step: null
  qty_tiers: 2000:4, 4000:3, 6000:2, 8000:1
  t_atr_len: 7
  rev_vol_min: null
  rev_vol_max: null
  adx_len: 14
  adx_min: null
  risk_usd: null
  qty_t1: 1
  t1_atr: 3.0
  qty_t2: 2
  trail_atr: 1.5
  t2_atr: 6
  max_hold_days: 2
  trail_act: 1.0
  sl_mode: atr
  sl_atr: 2.0
  be_after_t1: true
  be_atr: 3.0
  be_lock: 0.0
