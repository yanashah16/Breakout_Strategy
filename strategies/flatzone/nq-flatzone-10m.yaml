# Nasdaq Flat Zone 10m  -  from nq_wae_backtest/flatzone/flatzone_NQ_10m_hi.yaml (backtest: research/flatzone_backtest.py)
# Research notes:
# Flat Zone Breakout - NQ 10 min, MORE than 1000 trades (legs). Optimised 2026-11-22 (random + evolutionary + hill-climb search, ~27k combos for this timeframe, 1 tick slip).
#   1 tick: net $1,414k, max DD $66k, net/DD 21.56, 551 trades (1102 legs), PF 1.83.
#   0 slip net/DD 21.85 | 2 ticks 21.25 | 2016-22 net/DD 13.2, 2023-26 13.6 | neighbours median 16.4
#   Run:  python flatzone/flatzone_backtest.py flatzone/flatzone_NQ_10m_hi.yaml
id: nq-flatzone-10m
name: Nasdaq Flat Zone 10m
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 10-minute candles, long only.
how_it_enters: 'Finds a flat zone: 5+ candles (10-minute) whose closes stay within 3.5 ATR and drift at most 20 % of the zone
  height. A candle closing 0 % of the height beyond the zone (with a body that size) enters at that close, long only. Only
  if the candle''s volume is >= 2.2 x the same time of day''s average (10 days). No entries 15:00-18:00 New York. Volume >=
  3.0 x average: x2 quantity.'
how_it_exits: Stop at 4.0 ATR from the breakout close. Target contracts take profit 2.0 ATR from the breakout close. Runner
  contracts trail 15.0 ATR behind the best price, from 2.0 ATR in profit. Runner cap 8 ATR. At 6.0 ATR profit every stop locks
  entry + 1.0 ATR. If the first stop is hit within 20 candles it reverses once (same size, same stop distance). Closed after
  14 days.
experimental: false
default_qty:
- 1
- 2
engine: flatzone
source: nq_wae_backtest/flatzone/flatzone_NQ_10m_hi.yaml
data: {}
logic:
  timeframe: 10
  min_bars: 5
  max_bars: 12
  box_src: close
  atr_len: 150
  max_h_atr: 3.5
  max_slope: 20
  break_mode: body
  break_pct: 0
  direction: Long only
  skip_hours: 15:00-18:00
  rev_bars: 20
  vol_ref: tod
  vol_days: 10
  vol_min: 2.2
  vol_boost: 3.0
  vol_mult: 2
  qty_step: null
