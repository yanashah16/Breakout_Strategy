# S&P Flat Zone 15m Long  -  from nq_wae_backtest/flatzone/flatzone_ES_15m.yaml (backtest: research/flatzone_backtest.py)
# Research notes:
# Flat Zone Breakout - ES 15 min, optimised 2026-11-23 (random + evolutionary + hill-climb, 1 tick slip). Long only.
#   1 tick: net $1,900k, max DD $103k, net/DD 18.39, 556 trades (1111 legs), PF 2.52.
#   0 slip net/DD 18.73 | 2 ticks 17.76 | 2016-22 net/DD 18.9, 2023-26 13.4 | neighbours median 14.1
#   NOTE: fewer than 1000 trades and Long only - to be replaced by a >= 1000-trade, both-direction version.
#   Run:  python flatzone/flatzone_backtest.py flatzone/flatzone_ES_15m.yaml
id: sp-flatzone-15m-long
name: S&P Flat Zone 15m Long
family: S&P 500
signal: ES
markets:
- MES
- ES
pattern: Flat zone breakout
summary: Breakout of a tight sideways zone on 15-minute candles, long only.
how_it_enters: 'Finds a flat zone: 4+ candles (15-minute) whose closes stay within 3.5 ATR and drift at most 25 % of the zone
  height. A candle closing 20 % of the height beyond the zone (with a body that size) enters at that close, long only. Only
  if the candle''s volume is >= 1.0 x the same time of day''s average (20 days). Only when ADX(14) >= 25. No entries 08:00-09:30
  New York. Volume >= 3.0 x average: x2 quantity.'
how_it_exits: Stop at 2.5 ATR from the breakout close. Target contracts take profit 4.0 ATR from the breakout close. Runner
  contracts trail 15.0 ATR behind the best price, from 2.0 ATR in profit. Runner cap 40 ATR. At 4.0 ATR profit every stop
  locks entry + 1.0 ATR. If the first stop is hit within 15 candles it reverses once (same size, same stop distance).
experimental: false
default_qty:
- 1
- 2
engine: flatzone
source: nq_wae_backtest/flatzone/flatzone_ES_15m.yaml
