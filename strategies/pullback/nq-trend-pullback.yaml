id: nq-trend-pullback
name: Nasdaq Trend Pullback
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Trend pullback
summary: Buys dips (sells rallies) to the moving average in an established trend.
how_it_enters: In a clear trend it waits for price to dip back to its moving average, then enters when price turns
  back in the trend direction. The stop goes below the dip.
how_it_exits: Takes part of the profit at the first target and lets the rest run with a trailing stop. After the
  first target the stop moves to break-even, so the rest cannot lose.
