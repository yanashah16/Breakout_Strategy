id: nq-zone-bounce-reverse
name: Nasdaq Zone Bounce Reverse
family: Nasdaq 100
signal: NQ
markets:
- MNQ
- NQ
pattern: Zone line (reverse)
summary: 'Fades a bounce off a trend-line zone: when price bounces, it takes the other side.'
how_it_enters: 'Builds a trend line from at least 3 significant swing points with a narrow zone around it. When a candle bounces
  off the zone (a rising line: low into the zone, up close) it trades the OTHER way at that close (the bounce is expected
  to fail). Stop 7 ATR away.'
how_it_exits: 'Whole position to one target at 8 R. Closes after 144 candles (12 h) if still open. Sized by risk: each trade
  risks at most $1,000 at its stop (whole contracts, rounded down; skipped if 1 contract would risk more). The boxes set the
  Target : Runner split.'
experimental: true
default_qty:
- 1
- 0
engine: lines
