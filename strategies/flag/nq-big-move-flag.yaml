pattern: Flag breakout
summary: Only trades large moves compared to a normal day, in line with the 4-hour trend.
how_it_enters: Waits for a fast, strong move (the pole) followed by a short, quiet pause (the flag). When price
  breaks out of the pause in the direction of the move, it enters. The stop goes just beyond the other side of the
  pause.
how_it_exits: Holds the whole position as one runner with a trailing stop that follows the price, aiming to catch
  the big moves.
