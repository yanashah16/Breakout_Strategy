name: S&P Thrust Flag
family: S&P 500
signal: ES
markets:
- MES
- ES
pattern: Flag breakout
summary: Needs a powerful thrust before the flag. Half the position banks a target, half runs far.
how_it_enters: Waits for a fast, strong move (the pole) followed by a short, quiet pause (the flag). When price
  breaks out of the pause in the direction of the move, it enters. The stop goes just beyond the other side of the
  pause.
how_it_exits: Takes part of the profit at the first target and lets the rest run with a trailing stop.
