id: dow-box-breakout
name: Dow Box Breakout
family: Dow
signal: YM
markets:
- MYM
- YM
pattern: Box breakout, 3 targets
summary: Breakout of a sideways box on 5-minute candles, 3 legs, long and short.
how_it_enters: 'Box = the last 30 candles (5-minute, wicks), at most 15 x ATR(200) tall. A fresh close 0.5 ATR beyond the
  box enters at that close (both), with EMA(100) in the trade''s direction. Entry-condition score: at least 3 of 10 conditions
  (day_used_min, vwap_min, ema50_slope_min, adx_min, body_max, range_max, box_min, iv_min, ema200_slope_min, squeeze_max).
  Score >= 6: x2.5 size. IV index between 0 and 30.'
how_it_exits: 'Stop 100 % of the box height. Leg 1 takes profit at 2 R, then the stop goes to the entry. Leg 2 leaves on a
  close beyond EMA(200). Runner trails (gives back 60 % of the best profit), final target 10 R. Original stop hit within 30
  candles: reverses once.'
