summary: Breakout of a sideways box on 5-minute candles, 3 legs, long and short.
how_it_enters: 'Box = the last 50 candles (5-minute, closes), at most 10 x ATR(200) tall. A fresh close 0.5 ATR beyond the
  box enters at that close (both). Entry-condition score: at least 2 of 9 conditions (vwap_min, ema50_slope_min, adx_min,
  body_max, range_max, box_min, iv_min, ema50_dist_min, ema200_slope_min). Score >= 8: x3 size. IV index between 12 and 30.
  No entries 11:30-13:30 New York.'
how_it_exits: 'Stop 75 % of the box height. Leg 1 takes profit at 1.25 R, then the stop goes to the entry. Leg 2 leaves on
  a close beyond EMA(200). Runner trails (gives back 60 % of the best profit), final target 4 R. Original stop hit within
  30 candles: reverses once. Closed after 72 market hours.'
