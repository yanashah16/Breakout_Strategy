summary: Breakout of a sideways box on 5-minute candles, 3 legs, long and short.
how_it_enters: 'Box = the last 60 candles (5-minute, wicks), at most 20 x ATR(100) tall. A fresh close 0.3 ATR beyond the
  box enters at that close (both). Entry-condition score: at least 4 of 8 conditions (day_used_min, vwap_min, ema50_slope_min,
  adx_min, range_max, box_min, iv_min, squeeze_max). Score >= 6.0: x3 size. IV index between 10 and 30.'
how_it_exits: 'Stop 100 % of the box height. Leg 1 takes profit at 1 R, then the stop goes to the entry. Leg 2 at 3 R. Runner
  trails (gives back 60 % of the best profit), final target 10 R. Original stop hit within 10 candles: reverses once. Closed
  after 96 market hours.'
