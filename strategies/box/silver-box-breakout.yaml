how_it_enters: 'Box = the last 50 candles (5-minute, wicks), at most 20 x ATR(150) tall. A fresh close 1.5 ATR beyond the
  box enters at that close (both). Entry-condition score: at least 2 of 9 conditions (day_used_min, vwap_min, ema50_slope_min,
  adx_min, body_max, range_max, box_min, iv_min, ema50_dist_min). Score >= 6: x2 size. No entries 11:30-13:30 New York.'
how_it_exits: 'Stop 100 % of the box height. Leg 1 takes profit at 3 R, then the stop goes to the entry. Leg 2 at 3.5 R. Runner
  trails (gives back 30 % of the best profit), final target 5 R. Original stop hit within 10 candles: reverses once. Closed
  after 24 market hours.'
